<partial>
  <div class="relative -mx-4 overflow-hidden bg-slate-950 px-5 py-12 text-white sm:-mx-6 sm:px-8 sm:py-14 lg:-mx-8 lg:px-12 lg:py-20">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-950 via-slate-900 to-amber-950/80"/>
    <div class="absolute -right-20 top-0 h-64 w-64 rounded-full bg-amber-400/15 blur-3xl sm:h-80 sm:w-80"/>
    <div class="absolute left-0 top-24 h-56 w-56 rounded-full bg-teal-500/10 blur-3xl sm:h-72 sm:w-72"/>
    <div class="relative z-10">
      <div class="flex items-center gap-2 mb-3">
        <icon name="sparkles" class="w-5 h-5 text-amber-300"/>
        <span class="text-sm font-medium uppercase tracking-[0.18em] text-slate-300">$t:home.community_landing</span>
      </div>
      <h2 class="text-3xl font-semibold leading-tight text-white sm:text-4xl lg:text-5xl">$t:home.hero_title</h2>
      <p class="mt-4 max-w-2xl text-base leading-6 text-slate-300">$t:home.hero_description</p>
      <div class="mt-6 max-w-xl">
        <div data-if="{{!_global.currentUser?.uuid}}" class="flex flex-col gap-3">
          <p class="text-sm text-slate-300">$t:home.smart_cta.guest_message</p>
          <button variant="primary" size="md" class="gap-2 cursor-pointer self-start">
            <on type="click">
              <navigate path="/login">
                <query redirect="/board/qna/write"/>
              </navigate>
            </on>
            <span>$t:home.smart_cta.guest_button</span>
            <icon name="log-in" class="w-4 h-4"/>
          </button>
        </div>
        <div data-if="{{_global.currentUser?.uuid &amp;&amp; (((_global.currentUser?.posts_count ?? _global.currentUser?.post_count ?? _global.currentUser?.activity_count ?? 0) + (_global.currentUser?.comments_count ?? _global.currentUser?.comment_count ?? 0)) === 0)}}" class="flex flex-col gap-3">
          <p class="text-sm text-slate-300">$t:home.smart_cta.new_member_message</p>
          <button variant="primary" size="md" class="gap-2 cursor-pointer self-start">
            <on type="click">
              <navigate path="/board/qna/write"/>
            </on>
            <span>$t:home.smart_cta.new_member_button</span>
            <icon name="circle-help" class="w-4 h-4"/>
          </button>
        </div>
        <div data-if="{{_global.currentUser?.uuid &amp;&amp; (((_global.currentUser?.posts_count ?? _global.currentUser?.post_count ?? _global.currentUser?.activity_count ?? 0) + (_global.currentUser?.comments_count ?? _global.currentUser?.comment_count ?? 0)) > 0)}}" class="flex flex-col gap-3">
          <p class="text-sm text-slate-300">$t:home.smart_cta.active_member_message</p>
          <button variant="primary" size="md" class="gap-2 cursor-pointer self-start">
            <on type="click">
              <navigate path="/board/{{_global.lastVisitedBoardSlug ?? recent_posts?.data?.[0]?.board_slug ?? 'free'}}"/>
            </on>
            <span>$t:home.smart_cta.active_member_button</span>
            <icon name="arrow-right" class="w-4 h-4"/>
          </button>
        </div>
      </div>
      <div class="mt-6 flex items-center gap-2 text-sm text-slate-300">
        <icon name="users" class="w-4 h-4 text-slate-400"/>
        <span>$t:home.hero_footer</span>
      </div>
    </div>
  </div>
</partial>
